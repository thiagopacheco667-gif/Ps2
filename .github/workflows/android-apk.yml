# Nexus2: Android-only APK build. Steps mirror the "android" job in build-all.yml
# (upstream ARMSX2), so a failure here means the same thing it would upstream.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build release APK
        # Nexus2: versionCode rises with every build (above upstream's 1088), so each APK is a
        # newer version of the previous one and installs as an update.
        run: >-
          ./gradlew :app:assembleRelease --stacktrace
          -Parmsx2.versionCode=$((2000 + ${{ github.run_number }}))
          -Parmsx2.versionName=2.6.1-nexus.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nexus2-android-arm64
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
